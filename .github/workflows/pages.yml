# 每次 push 到 main 就 build 前端並部署到 GitHub Pages：
#   https://<user>.github.io/<repo>/
# 第一次使用前：repo Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
# 合約部署後，到 Settings → Secrets and variables → Actions → Variables 設 VITE_CONTRACT_ID 等變數。
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24   # npm 11：lockfile 是 npm 11 產生的，npm 10 會判定不同步
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build (base = /<repo>/)
        working-directory: frontend
        env:
          V_NETWORK_ID: ${{ vars.VITE_NETWORK_ID }}
          V_CONTRACT_ID: ${{ vars.VITE_CONTRACT_ID }}
          V_CONTRACT_ID_TESTNET: ${{ vars.VITE_CONTRACT_ID_TESTNET }}
          V_CONTRACT_ID_MAINNET: ${{ vars.VITE_CONTRACT_ID_MAINNET }}
          V_VIEWER_URL: ${{ vars.VITE_VIEWER_URL }}
          V_REOWN_PROJECT_ID: ${{ vars.VITE_REOWN_PROJECT_ID }}
        run: |
          # 只把有設定的 Variables 寫進 .env.production.local；沒設定就沿用 repo 裡的 .env
          : > .env.production.local
          for k in NETWORK_ID CONTRACT_ID CONTRACT_ID_TESTNET CONTRACT_ID_MAINNET VIEWER_URL REOWN_PROJECT_ID; do
            v=$(printenv "V_$k" || true)
            if [ -n "$v" ]; then echo "VITE_$k=$v" >> .env.production.local; fi
          done
          npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
