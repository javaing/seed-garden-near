# 每次 push 到 main 就 build 前端並部署到 GitHub Pages：
#   https://<user>.github.io/<repo>/
# 第一次使用前：repo Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
# 合約部署後，到 Settings → Secrets and variables → Actions → Variables 設 VITE_CONTRACT_ID 等變數。
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build (base = /<repo>/)
        working-directory: frontend
        env:
          VITE_NETWORK_ID: ${{ vars.VITE_NETWORK_ID || 'testnet' }}
          VITE_CONTRACT_ID: ${{ vars.VITE_CONTRACT_ID }}
          VITE_VIEWER_URL: ${{ vars.VITE_VIEWER_URL }}
          VITE_REOWN_PROJECT_ID: ${{ vars.VITE_REOWN_PROJECT_ID }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
