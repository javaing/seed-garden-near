[package]
name = "seed_nft"
description = "Generative NFT (NEP-171/177/178/181/199) whose seed is fixed at mint time"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# `cargo near build non-reproducible-wasm` 用；reproducible build 需要 Docker，這裡先不設定。
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.95.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
